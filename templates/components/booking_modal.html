<div id="booking-modal" class="modal-backdrop hidden">
    <div class="modal-window">
        <div class="modal-header">
            <h3 id="modal-title">Аудиторія №320</h3>
            <button type="button" id="modal-close-btn" class="modal-close">&times;</button>
        </div>

        <div class="modal-body">
            <div id="modal-room-details" class="room-details-box"></div>

            <div id="modal-occupancy-box" class="occupancy-alert"></div>

            <div id="admin-room-controls" class="hidden" style="margin-bottom: 14px; padding: 10px 12px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 13px; font-weight: 600; color: #495057;">Статус роботи аудиторії:</span>
                    <button type="button" id="btn-toggle-room-status" class="btn-action-sm"></button>
                </div>
            </div>

            <form id="booking-form" class="booking-form">
                <input type="hidden" id="form-room-id">

                <div class="form-row-two">
                    <div class="form-group">
                        <label>Обрана дата:</label>
                        <input type="text" id="form-date-display" class="pnu-input" readonly>
                    </div>
                    <div class="form-group">
                        <label>Часовий слот:</label>
                        <input type="text" id="form-slot-display" class="pnu-input" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-purpose">Призначення: *</label>
                    <input type="text" id="form-purpose" class="pnu-input">
                    <small id="form-error-msg" class="error-text hidden"></small>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> 
                        <span>Надіслати сповіщення на корпоративну пошту при зміні статусу</span>
                    </label>
                </div>

                <div class="modal-footer-btns">
                    <button type="button" id="modal-cancel-btn" class="btn-outline-pnu">Скасувати</button>
                    <button type="submit" id="modal-submit-btn" class="btn-primary-pnu">Підтвердити</button>
                </div>
            </form>
        </div>
    </div>
</div>
